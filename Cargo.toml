[package]
name = "rusted-zip"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
# Optimise aggressively for size of .wasm bundle
opt-level     = "z"   # optimise for size
lto           = true  # link-time optimisation — removes dead code across crates
codegen-units = 1     # single codegen unit — better optimisation, slower compile
panic         = "abort" # smaller panic handler, no unwinding in WASM